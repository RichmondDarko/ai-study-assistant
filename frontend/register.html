<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Create Account — StudyAI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07090f;--surf:#0d1117;--card:#111827;--card2:#161f2e;
  --border:#1e2d40;--border2:#253347;
  --blue:#3b82f6;--blue-dk:#2563eb;--blue-glo:rgba(59,130,246,0.15);
  --violet:#8b5cf6;--emerald:#10b981;--danger:#ef4444;
  --text:#f1f5f9;--sub:#94a3b8;--muted:#475569;
}
html,body{height:100%;-webkit-font-smoothing:antialiased}
body{
  background:var(--bg);color:var(--text);
  font-family:'Inter',sans-serif;
  display:grid;grid-template-columns:1fr 1fr;min-height:100vh;
}
.left{
  background:linear-gradient(160deg,#080d1a 0%,#0f1535 50%,#080d1a 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:60px 48px;position:relative;overflow:hidden;
}
.orb{position:absolute;border-radius:50%;pointer-events:none;filter:blur(70px)}
.orb1{width:380px;height:380px;top:-100px;left:-100px;background:rgba(59,130,246,0.18)}
.orb2{width:300px;height:300px;bottom:-80px;right:-80px;background:rgba(139,92,246,0.14)}
.left-inner{position:relative;z-index:1;text-align:center;max-width:340px}
.logo-box{
  width:80px;height:80px;margin:0 auto 28px;
  background:linear-gradient(135deg,var(--blue),var(--violet));
  border-radius:22px;display:flex;align-items:center;justify-content:center;
  font-size:36px;
  box-shadow:0 0 50px rgba(99,102,241,0.4),0 0 100px rgba(99,102,241,0.12);
  animation:float 4s ease-in-out infinite;
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.left-inner h1{font-family:'Sora',sans-serif;font-size:2rem;font-weight:800;margin-bottom:10px}
.left-inner p{color:var(--sub);font-size:0.9rem;line-height:1.75;margin-bottom:36px}
.steps{display:flex;flex-direction:column;gap:12px;text-align:left}
.step{
  display:flex;align-items:center;gap:12px;
  padding:12px 16px;border-radius:12px;
  background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);
  font-size:0.82rem;color:var(--sub);
}
.step-num{
  width:28px;height:28px;min-width:28px;border-radius:8px;
  background:linear-gradient(135deg,var(--blue),var(--violet));
  display:flex;align-items:center;justify-content:center;
  font-size:0.75rem;font-weight:700;color:#fff;
}

.right{
  display:flex;align-items:center;justify-content:center;
  padding:60px 48px;background:var(--bg);overflow-y:auto;
}
.form-box{width:100%;max-width:400px}
.form-box h2{font-family:'Sora',sans-serif;font-size:1.75rem;font-weight:800;margin-bottom:6px}
.form-box .sub{color:var(--muted);font-size:0.875rem;margin-bottom:32px}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{margin-bottom:18px}
.field label{display:block;font-size:0.75rem;font-weight:600;color:var(--sub);margin-bottom:7px;text-transform:uppercase;letter-spacing:0.04em}
.field input{
  width:100%;padding:13px 15px;
  background:var(--card);border:1.5px solid var(--border2);
  border-radius:12px;color:var(--text);
  font-family:'Inter',sans-serif;font-size:0.9rem;outline:none;
  transition:border-color 0.18s,box-shadow 0.18s;
}
.field input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,0.15)}
.field input::placeholder{color:var(--muted)}
.pw-wrap{position:relative}
.pw-wrap input{width:100%;padding-right:46px}
.pw-toggle{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;
  color:var(--muted);font-size:1.1rem;padding:4px;
  transition:color 0.15s;line-height:1;
}
.pw-toggle:hover{color:var(--sub)}

.err{
  background:rgba(239,68,68,0.1);color:#f87171;
  border:1px solid rgba(239,68,68,0.2);border-radius:10px;
  padding:11px 14px;font-size:0.8rem;margin-bottom:16px;
  display:none;align-items:center;gap:8px;
}
.err.show{display:flex}

.submit-btn{
  width:100%;padding:13px;border-radius:12px;border:none;
  background:linear-gradient(135deg,var(--blue),var(--violet));
  color:#fff;font-family:'Inter',sans-serif;
  font-size:0.9rem;font-weight:600;cursor:pointer;
  box-shadow:0 4px 18px rgba(99,102,241,0.3);
  transition:all 0.18s;
}
.submit-btn:hover{opacity:0.88;transform:translateY(-1px)}
.submit-btn:active{transform:scale(0.98)}
.submit-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;box-shadow:none}

.foot{text-align:center;margin-top:22px;font-size:0.82rem;color:var(--muted)}
.foot a{color:#60a5fa;text-decoration:none;font-weight:600}
.foot a:hover{text-decoration:underline}

@media(max-width:768px){
  body{grid-template-columns:1fr}
  .left{display:none}
  .right{padding:40px 24px}
  .two-col{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- LEFT -->
<div class="left">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="left-inner">
    <div class="logo-box">🧠</div>
    <h1>Get started free</h1>
    <p>Create your account and start studying smarter in under a minute.</p>
    <div class="steps">
      <div class="step"><div class="step-num">1</div>Create your account</div>
      <div class="step"><div class="step-num">2</div>Upload your study materials</div>
      <div class="step"><div class="step-num">3</div>Ask the AI anything</div>
    </div>
  </div>
</div>

<!-- RIGHT -->
<div class="right">
  <div class="form-box">
    <h2>Create account</h2>
    <p class="sub">Start studying smarter — it's completely free</p>

    <div class="err" id="errMsg"></div>

    <div class="two-col">
      <div class="field">
        <label>First name</label>
        <input type="text" id="firstName" placeholder="John" autocomplete="given-name"/>
      </div>
      <div class="field">
        <label>Last name</label>
        <input type="text" id="lastName" placeholder="Doe" autocomplete="family-name"/>
      </div>
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email"/>
    </div>
    <div class="field">
      <label>Password</label>
      <div class="pw-wrap">
        <input type="password" id="password" placeholder="At least 6 characters" autocomplete="new-password"/>
        <button class="pw-toggle" type="button" onclick="togglePw('password',this)" tabindex="-1">👁</button>
      </div>
    </div>
    <div class="field">
      <label>Confirm password</label>
      <div class="pw-wrap">
        <input type="password" id="confirmPassword" placeholder="Repeat your password" autocomplete="new-password"
          onkeydown="if(event.key==='Enter')register()"/>
        <button class="pw-toggle" type="button" onclick="togglePw('confirmPassword',this)" tabindex="-1">👁</button>
      </div>
    </div>
    <button class="submit-btn" id="submitBtn" onclick="register()">Create Account</button>
    <div class="foot">Already have an account? <a href="login.html">Sign in</a></div>
  </div>
</div>

<script>
const API = 'http://localhost:5000/api';
if (localStorage.getItem('token')) window.location.href = 'dashboard.html';

function togglePw(id, btn) {
  const input = document.getElementById(id);
  const show  = input.type === 'password';
  input.type  = show ? 'text' : 'password';
  btn.textContent = show ? '🙈' : '👁';
}

async function register() {
  const first_name      = document.getElementById('firstName').value.trim();
  const last_name       = document.getElementById('lastName').value.trim();
  const email           = document.getElementById('email').value.trim();
  const password        = document.getElementById('password').value;
  const confirmPassword = document.getElementById('confirmPassword').value;
  const errEl           = document.getElementById('errMsg');
  errEl.classList.remove('show');

  if (!first_name || !last_name || !email || !password) {
    errEl.textContent = '⚠️ Please fill in all fields.';
    errEl.classList.add('show'); return;
  }
  if (password !== confirmPassword) {
    errEl.textContent = '⚠️ Passwords do not match.';
    errEl.classList.add('show'); return;
  }
  if (password.length < 6) {
    errEl.textContent = '⚠️ Password must be at least 6 characters.';
    errEl.classList.add('show'); return;
  }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'Creating account...';

  try {
    const res  = await fetch(`${API}/auth/register`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({first_name, last_name, email, password})
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || 'Registration failed');
    window.location.href = 'login.html?registered=1';
  } catch(e) {
    errEl.textContent = '❌ ' + e.message;
    errEl.classList.add('show');
    btn.disabled = false; btn.textContent = 'Create Account';
  }
}
</script>
</body>
</html>
